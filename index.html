<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compound Interest Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Compound Interest Calculator</h1>
      <label class="theme-toggle">
        <input type="checkbox" id="theme-checkbox" />
        <span class="slider"></span>
      </label>
    </header>

    <div class="layout">
      <form id="calc-form" class="panel">
        <div class="field">
          <label for="principal">Starting amount</label>
          <input type="number" id="principal" value="1000" min="0" step="100" />
        </div>
        <div class="field">
          <label for="contribution">Monthly contribution</label>
          <input type="number" id="contribution" value="100" min="0" step="10" />
        </div>
        <div class="field">
          <label for="rate">Annual interest rate (%)</label>
          <input type="number" id="rate" value="7" min="0" step="0.1" />
        </div>
        <div class="field">
          <label for="years">Number of years</label>
          <input type="number" id="years" value="20" min="1" max="60" step="1" />
        </div>
      </form>

      <div class="panel results">
        <canvas id="chart" width="700" height="360"></canvas>
        <div class="legend">
          <span class="legend-item"><span class="dot balance"></span>Total balance</span>
          <span class="legend-item"><span class="dot contributed"></span>Total contributed</span>
        </div>
        <div class="summary" id="summary"></div>
      </div>
    </div>
  </div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
